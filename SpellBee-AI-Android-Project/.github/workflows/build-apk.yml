name: Build SpellBee AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Vosk Offline Model into assets
        run: |
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          curl -L -o vosk-model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip vosk-model.zip
          mv vosk-model-small-en-us-0.15 model-en-us
          rm vosk-model.zip

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; else gradle wrapper; chmod +x gradlew; fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpellBee-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
